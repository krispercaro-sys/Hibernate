spring.application.name=hibernate-demo

spring.datasource.url=jdbc:oracle:thin:@localhost:1521/xepdb1
spring.datasource.username=system
spring.datasource.password=system

# Reduce logging level. Only warn is displayed for general spring/hibernate logs
logging.level.root=warn

# Turn off Spring Boot Banner
spring.main.banner-mode=off

# Display single-line SQL statements and parameter bindings
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

# Clean up console log pattern to remove timestamps/thread names
logging.pattern.console=: %m%n

# Configure JPA/Hibernate to auto create/update the tables
spring.jpa.hibernate.ddl-auto=update

# Tells Hibernate to generate SQL suitable for Oracle databases
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# Turn off duplicate standard SQL formatting (logging.level.org.hibernate.SQL handles it)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false